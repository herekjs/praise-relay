# Render에서 api 서버를 올리는 설정이에요. 디스크가 있어야 글이 서버를 다시 켜도 남아요.
services:
  - type: web
    name: praise-relay-api
    runtime: docker
    rootDir: api
    plan: starter
    healthCheckPath: /api/entries
    envVars:
      - key: DB_URL
        value: jdbc:sqlite:/data/praise.db
    disk:
      name: praise-data
      mountPath: /data
      sizeGB: 1
